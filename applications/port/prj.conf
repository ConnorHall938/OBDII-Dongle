# This file contains selected Kconfig options for the application.

CONFIG_LED=y
CONFIG_LED_GPIO=y

# compiler
#CONFIG_DEBUG_OPTIMIZATIONS=y

# logging
CONFIG_LOG=y
#CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_APP_LOG_LEVEL_DBG=y

# --- core ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="CAN-BLE"

# --- throughput ---
CONFIG_BT_EXT_ADV=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
# DLE: 27 -> 251 byte link-layer PDUs
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# queue depth for bursts
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_CONN_TX_MAX=16

# NUS
CONFIG_BT_ZEPHYR_NUS=y


# --- stack sizing ---
# CONFIG_LOG_MODE_IMMEDIATE formats each message on the *calling* thread's
# stack (cbprintf packaging + log_output backend). The BT host threads run at
# the defaults sized for deferred logging, so the RX workqueue overflowed
# rx_thread_stack and smashed the thread stack placed immediately below it in
# .bss (bt_tx_processor_stack). Give every thread that logs real headroom.
# CONFIG_BT_RX_STACK_SIZE=2048
# CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
# CONFIG_BT_LONG_WQ_STACK_SIZE=2048
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- stack overflow diagnostics (drop once tuned) ---
# STACK_SENTINEL turns a silent neighbour-stack smash into a loud kernel panic
# naming the offending thread; THREAD_ANALYZER reports high-water marks.
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
